<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <title>비밀번호 변경</title>
    <link rel="stylesheet" th:href="@{/assets/css/header.css}">
    <link rel="stylesheet" th:href="@{/assets/css/JW/notification-empty.css}">
    <link rel="stylesheet" th:href="@{/assets/css/JW/notification-detail.css}">
    <link rel="stylesheet" th:href="@{/assets/css/chatbot.css}">
    <link rel="stylesheet" th:href="@{/assets/css/SY/member.mypage.css(v=2)}">
</head>
<body>
<div class="sy-mypage" th:with="currentMenu='mypage'">
    <th:block th:insert="~{fragments/header::header}"></th:block>

    <div class="sy-mypage-wrap">
        <aside class="sy-mypage-card sy-mypage-side">
            <div class="sy-mypage-avatar" th:text="${user.firstChar}">U</div>

            <div class="sy-mypage-name" th:text="${user.user_name}">닉네임</div>
            <div class="sy-mypage-real-name" th:text="${user.real_name}">이름</div>

            <div class="sy-mypage-badges">
                <span class="sy-mypage-badge"
                      th:text="${user.auth == 'USER_ADMIN' ? '관리자' : '유저'}">유저</span>

                <span class="sy-mypage-badge sy-mypage-badge-muted"
                      th:text="${user.google_id != null and !#strings.isEmpty(user.google_id) ? 'Google 연동' : 'Google 비연동'}">
                    Google 비연동
                </span>
            </div>

            <div class="sy-mypage-stats">
                <div class="sy-mypage-stat">
                    <strong th:text="${teamCount}">0</strong>
                    <span>참여팀</span>
                </div>
                <div class="sy-mypage-stat">
                    <strong th:text="${kanbanCount}">0</strong>
                    <span>칸반카드</span>
                </div>
                <div class="sy-mypage-stat">
                    <strong th:text="${minutesCount}">0</strong>
                    <span>회의록</span>
                </div>
            </div>

            <nav class="sy-mypage-menu">
                <a class="active" th:href="@{/member/myPage}">
                    <span>👤</span>
                    프로필 수정
                </a>
                <a th:href="@{/member/todos}">
                    <span>✅</span>
                    개인 To-Do
                </a>
                <a th:href="@{/member/notifications}">
                    <span>🔔</span>
                    알림관리
                </a>
                <a href="#">
                    <span>⚠</span>
                    계정 관리
                </a>
            </nav>
        </aside>

        <section class="sy-mypage-card sy-mypage-main sy-password-card">
            <div class="sy-mypage-main-head">
                <h2 class="sy-mypage-title">🔑 비밀번호 변경</h2>
            </div>

            <div class="sy-password-notice">
                Google 계정으로 연동된 경우, Google 비밀번호를 변경하세요.
            </div>

            <div class="sy-mypage-alert success" th:if="${passwordSuccess}" th:text="${passwordSuccess}">
                비밀번호 변경이 완료됐습니다.
            </div>

            <form th:action="@{/member/changePassword}" method="post" class="sy-password-form" autocomplete="off">
                <div class="sy-mypage-field full">
                    <label for="sy-current-passwd">현재 비밀번호</label>
                    <input type="password"
                           id="sy-current-passwd"
                           name="currentPasswd"
                           placeholder="현재 비밀번호">
                    <p class="sy-password-error" th:if="${currentPasswordError}" th:text="${currentPasswordError}">
                        현재 비밀번호가 틀렸습니다.
                    </p>
                </div>

                <div class="sy-mypage-field full">
                    <label for="sy-new-passwd">새 비밀번호</label>
                    <input type="password"
                           id="sy-new-passwd"
                           name="newPasswd"
                           placeholder="8자 이상">
                    <p class="sy-password-error" th:if="${newPasswordError}" th:text="${newPasswordError}">
                        비밀번호는 영문, 숫자, 특수문자 8~20자로 입력해주세요.
                    </p>
                </div>

                <div class="sy-mypage-field full">
                    <label for="sy-confirm-passwd">새 비밀번호 확인</label>
                    <input type="password"
                           id="sy-confirm-passwd"
                           name="confirmPasswd"
                           placeholder="동일하게 입력">
                    <p class="sy-password-error" th:if="${confirmPasswordError}" th:text="${confirmPasswordError}">
                        새 비밀번호와 새 비밀번호 확인이 일치하지 않습니다.
                    </p>
                </div>

                <div class="sy-password-actions">
                    <a class="sy-mypage-btn" th:href="@{/member/myPage}">마이페이지로</a>
                    <button type="submit" class="sy-mypage-btn primary">비밀번호 변경</button>
                </div>
            </form>
        </section>
    </div>

    <th:block th:insert="~{fragments/chatbot::chatbot}"></th:block>
</div>

<script th:src="@{/assets/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/assets/js/chatbot.js}"></script>
</body>
</html>
