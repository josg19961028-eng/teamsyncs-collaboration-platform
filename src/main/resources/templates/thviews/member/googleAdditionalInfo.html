<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>TeamSync - 추가정보 입력</title>
  <link rel="stylesheet" th:href="@{/assets/css/SY/member.login.css(v=2)}"/>
</head>
<body>
<div class="sy-member-page">
  <div class="sy-member-card">
    <div class="sy-signup-title">
      <div class="sy-brand-mark">TS</div>
      <h2 class="sy-title">TeamSync</h2>
    </div>

    <div class="sy-auth-view sy-show">
      <h3 class="sy-subview-title">추가정보 입력</h3>
      <p class="sy-sub">Google 로그인 사용을 위해 필요한 정보를 입력해주세요.</p>

      <div class="sy-msg sy-msg-error" th:if="${googleInfoError}" th:text="${googleInfoError}"></div>

      <form th:action="@{/users/google/additional-info}" method="post" id="sy-google-info-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="sy-field">
          <label>이메일</label>
          <input type="email" th:value="${user.email}" readonly>
        </div>

        <div class="sy-field">
          <label>실명 <span class="sy-required">*</span></label>
          <input type="text" name="real_name" id="sy-google-real-name" placeholder="홍길동" autocomplete="off" required>
        </div>

        <div class="sy-field">
          <label>휴대폰번호 <span class="sy-required">*</span></label>
          <input type="text" name="phone" id="sy-google-phone" placeholder="01012345678 (- 제외)" inputmode="numeric" maxlength="11" autocomplete="off" required>
        </div>

        <div class="sy-field">
          <label>생년월일 <span class="sy-required">*</span></label>
          <input type="text" name="birthText" id="sy-google-birth" placeholder="19980509" inputmode="numeric" maxlength="8" autocomplete="off" required>
        </div>

        <button type="submit" class="sy-btn sy-btn-primary">저장하고 시작하기</button>
      </form>
    </div>
  </div>
</div>

<script>
  (function () {
    var phone = document.getElementById('sy-google-phone');
    var birth = document.getElementById('sy-google-birth');
    if (phone) {
      phone.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 11);
      });
    }
    if (birth) {
      birth.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 8);
      });
    }
  })();
</script>
</body>
</html>
